<script>
    // Fungsi membaca parameter URL
    const params = new URLSearchParams(window.location.search);

    // Ambil order_id (bisa membaca jika ada bug 'id' atau 'order_id')
    const orderId = params.get('order_id') || params.get('id') || '-';

    // Pengisian data ke ID elemen HTML yang benar
    document.getElementById('id_order').innerText = orderId;
    document.getElementById('tanggal').innerText = (params.get('tanggal') || '') + ' ' + (params.get('waktu') || '');
    document.getElementById('nama_pelanggan').innerText = params.get('pelanggan') || '-';
    document.getElementById('metode_pembayaran').innerText = params.get('metode') || 'Tunai';

    // Format Angka Rupiah
    function formatRupiah(angka) {
        const val = parseInt(angka) || 0;
        return 'Rp ' + val.toLocaleString('id-ID');
    }

    document.getElementById('total_bayar').innerText = formatRupiah(params.get('total'));

    // Parsing Rincian Item (Format: Nama|Qty|Harga,Nama|Qty|Harga)
    const itemsParam = params.get('items');
    const itemsContainer = document.getElementById('items-container');

    if (itemsParam) {
        const itemsList = itemsParam.split(',');
        itemsContainer.innerHTML = ''; // bersihkan kontainer
        
        itemsList.forEach(itemStr => {
            const parts = itemStr.split('|');
            if (parts.length >= 3) {
                const nama = parts[0].trim();
                const qty = parts[1].trim();
                const subtotal = parts[2].trim();

                const div = document.createElement('div');
                div.style.marginBottom = '4px';
                div.innerHTML = `
                    <div>${nama}</div>
                    <div class="item-row">
                        <span>  ${qty} x</span>
                        <span>${formatRupiah(subtotal)}</span>
                    </div>
                `;
                itemsContainer.appendChild(div);
            }
        });
    } else {
        itemsContainer.innerHTML = '<div>- Tidak ada detail item -</div>';
    }

    // Pemicu Dialog Print Otomatis
    window.onload = function() {
        setTimeout(() => {
            window.print();
        }, 500);
    };
</script>
