<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struk Pembayaran - Ayam Bakar Aroma (USB Print)</title>
    <!-- Library untuk Screenshot Layout & Koneksi USB via QZ Tray -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qz-tray/2.2.4/qz-tray.min.js"></script>
    
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #000;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f9;
        }
        #receipt-area {
            width: 500px;
            padding: 15px;
            background: #fff;
            margin: 0 auto;
            border: 1px solid #ccc;
        }
        .text-center { text-align: center; }
        .bold { font-weight: bold; }
        .line { border-bottom: 2px dashed #000; margin: 10px 0; }
        .row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .item-row { display: flex; justify-content: space-between; font-size: 12px; padding-left: 10px; }
        .item-title { font-weight: bold; margin-top: 5px; }
        
        .status-box {
            max-width: 500px;
            margin: 15px auto;
            padding: 10px;
            text-align: center;
            font-family: sans-serif;
            font-weight: bold;
            border-radius: 5px;
            background-color: #e2e3e5;
            color: #383d41;
        }
    </style>
</head>
<body>

    <div id="status" class="status-box">Menghubungkan ke QZ Tray...</div>

    <div id="receipt-area">
        <div class="text-center bold" style="font-size: 18px;">AYAM BAKAR AROMA</div>
        <div class="text-center" style="font-size: 13px;">Nota Pembayaran</div>
        <div class="line"></div>

        <div class="row"><span>No. Order:</span><span id="order_id" class="bold">-</span></div>
        <div class="row"><span>Tanggal:</span><span id="tanggal">-</span></div>
        <div class="row"><span>Pelanggan:</span><span id="pelanggan">-</span></div>
        <div class="row"><span>Metode:</span><span id="metode">-</span></div>

        <div class="line"></div>
        <div class="bold">Rincian Pesanan:</div>
        <div id="items-container"></div>

        <div class="line"></div>
        <div class="row"><span>Subtotal:</span><span id="subtotal">Rp 0</span></div>
        <div id="promo-row" class="row" style="display: none;">
            <span id="label_promo">Potongan Promo:</span>
            <span id="potongan">-Rp 0</span>
        </div>

        <div class="row bold" style="font-size: 16px; margin-top: 6px;">
            <span>Total Harga:</span>
            <span id="total_harga">Rp 0</span>
        </div>
        <div class="row"><span>Total Bayar:</span><span id="total_bayar">Rp 0</span></div>
        <div class="row"><span>Kembalian:</span><span id="kembalian">Rp 0</span></div>

        <div class="line"></div>
        <div class="text-center" style="margin-top: 15px;">
            *** TERIMA KASIH ***<br>
            Selamat Menikmati
            <br><br>
        </div>
    </div>

    <script>
    // ** PENGATURAN NAMA PRINTER USB ANDA **
    // Ganti teks 'RPP02N' sesuai nama printer Anda di 'Control Panel -> Devices and Printers' Windows
    const PRINTER_NAME_USB = "RPP02N"; 

    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id') || params.get('id') || 'STRUK';
    const tanggalStr = (params.get('tanggal') || '') + ' ' + (params.get('waktu') || '');
    
    document.getElementById('order_id').innerText = orderId;
    document.getElementById('tanggal').innerText = tanggalStr;
    document.getElementById('pelanggan').innerText = params.get('pelanggan') || '-';
    document.getElementById('metode').innerText = params.get('metode') || 'Tunai';

    function formatRupiah(angka) {
        return 'Rp ' + (parseInt(angka) || 0).toLocaleString('id-ID');
    }

    document.getElementById('subtotal').innerText = formatRupiah(params.get('subtotal'));
    
    const potonganVal = parseInt(params.get('potongan')) || 0;
    if (potonganVal > 0) {
        document.getElementById('promo-row').style.display = 'flex';
        document.getElementById('potongan').innerText = '- ' + formatRupiah(potonganVal);
    }

    document.getElementById('total_harga').innerText = formatRupiah(params.get('total_harga') || params.get('total'));
    document.getElementById('total_bayar').innerText = formatRupiah(params.get('total_bayar'));
    document.getElementById('kembalian').innerText = formatRupiah(params.get('kembalian'));

    const itemsParam = params.get('items');
    const itemsContainer = document.getElementById('items-container');
    if (itemsParam && itemsContainer) {
        itemsContainer.innerHTML = '';
        itemsParam.split(',').forEach(itemStr => {
            const parts = itemStr.split('|');
            if (parts.length >= 3) {
                const div = document.createElement('div');
                div.innerHTML = `
                    <div class="item-title">${parts[0].trim()}</div>
                    <div class="item-row">
                        <span>${parts[1].trim()} x</span>
                        <span>${formatRupiah(parts[2].trim())}</span>
                    </div>
                `;
                itemsContainer.appendChild(div);
            }
        });
    }

    // FUNGSI OTOMATIS CETAK KE USB VIA QZ TRAY
    async function prosesCetakUSB() {
        const statusDiv = document.getElementById('status');
        try {
            // 1. Hubungkan ke QZ Tray
            if (!qz.websocket.isActive()) {
                await qz.websocket.connect();
            }
            statusDiv.innerText = "Terhubung ke QZ Tray. Memproses cetak...";
            statusDiv.style.backgroundColor = "#cce5ff";

            // 2. Render layout HTML struk menjadi Image Canvas
            const element = document.getElementById('receipt-area');
            const canvas = await html2canvas(element, { scale: 1.5, backgroundColor: "#ffffff" });
            const imgBase64 = canvas.toDataURL("image/png");

            // 3. Konfigurasi Printer USB & Data Perintah Cetak
            const config = qz.configs.create(PRINTER_NAME_USB);
            const printData = [{
                type: 'pixel',
                format: 'image',
                flavor: 'base64',
                data: imgBase64
            }];

            // 4. Kirim langsung ke Printer USB
            await qz.print(config, printData);
            statusDiv.innerText = "✅ Struk Berhasil Dicetak!";
            statusDiv.style.backgroundColor = "#d4edda";
            statusDiv.style.color = "#155724";

            // Tutup tab otomatis setelah 2 detik
            setTimeout(() => { window.close(); }, 2000);

        } catch (err) {
            console.error(err);
            statusDiv.innerText = "❌ Gagal Cetak: Pastikan QZ Tray berjalan & nama printer sesuai!";
            statusDiv.style.backgroundColor = "#f8d7da";
            statusDiv.style.color = "#721c24";
        }
    }

    // Jalankan otomatis saat halaman dibuka dari AppSheet Web
    window.onload = function() {
        setTimeout(prosesCetakUSB, 1000);
    };
    </script>
</body>
</html>
