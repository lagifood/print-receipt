<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struk Pembayaran - Ayam Bakar Aroma</title>
    <style>
        /* CSS Pengaturan Cetak Kertas Thermal 80mm */
        @page {
            size: 80mm auto;
            margin: 0;
        }
        
        * {
            box-sizing: border-box;
        }

        body {
            width: 80mm;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #000;
            margin: 0 auto;
            padding: 8mm 5mm;
            background-color: #fff;
        }

        .text-center { 
            text-align: center; 
        }

        .bold { 
            font-weight: bold; 
        }

        .line {
            border-bottom: 1px dashed #000;
            margin: 8px 0;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding-left: 10px;
        }

        .item-title {
            font-weight: bold;
            margin-top: 4px;
        }

        .button-container {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 16px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #000;
            background-color: #f0f0f0;
            border-radius: 4px;
        }

        .btn-primary {
            background-color: #007bff;
            color: #fff;
            border-color: #0056b3;
        }

        /* Sembunyikan tombol aksi saat proses print berlangsung */
        @media print {
            .no-print { 
                display: none !important; 
            }
            body {
                padding: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER STRUK -->
    <div class="text-center bold" style="font-size: 16px; margin-bottom: 2px;">AYAM BAKAR AROMA</div>
    <div class="text-center" style="font-size: 12px;">Nota Pembayaran</div>
    <div class="line"></div>

    <!-- INFORMASI TRANSAKSI -->
    <div class="row"><span>No. Order:</span><span id="order_id" class="bold">-</span></div>
    <div class="row"><span>Tanggal:</span><span id="tanggal">-</span></div>
    <div class="row"><span>Pelanggan:</span><span id="pelanggan">-</span></div>
    <div class="row"><span>Metode:</span><span id="metode">-</span></div>

    <div class="line"></div>

    <!-- RINCIAN PESANAN -->
    <div class="bold" style="margin-bottom: 4px;">Rincian Pesanan:</div>
    <div id="items-container"></div>

    <div class="line"></div>

    <!-- TOTAL DAN PEMBAYARAN -->
    <div class="row"><span>Subtotal:</span><span id="subtotal">Rp 0</span></div>
    <div id="promo-row" class="row" style="display: none;">
        <span id="label_promo">Potongan Promo:</span>
        <span id="potongan">-Rp 0</span>
    </div>

    <div class="row bold" style="font-size: 14px; margin-top: 6px;">
        <span>Total Harga:</span>
        <span id="total_harga">Rp 0</span>
    </div>
    <div class="row"><span>Total Bayar:</span><span id="total_bayar">Rp 0</span></div>
    <div class="row"><span>Kembalian:</span><span id="kembalian">Rp 0</span></div>

    <div class="line"></div>

    <!-- FOOTER STRUK -->
    <div class="text-center" style="margin-top: 10px; font-size: 12px;">
        *** TERIMA KASIH ***<br>
        Selamat Menikmati
    </div>

    <!-- TOMBOL AKSI -->
    <div class="no-print button-container">
        <button class="btn btn-primary" onclick="cetakOtomatis()">Cetak Struk</button>
        <button class="btn" onclick="window.print()">Print Manual (Windows)</button>
    </div>

    <script>
    // 1. Ambil Parameter dari URL
    const params = new URLSearchParams(window.location.search);

    const orderId = params.get('order_id') || params.get('id') || '-';
    const tanggalStr = (params.get('tanggal') || '') + ' ' + (params.get('waktu') || '');
    const pelanggan = params.get('pelanggan') || '-';
    const metode = params.get('metode') || 'Tunai';

    document.getElementById('order_id').innerText = orderId;
    document.getElementById('tanggal').innerText = tanggalStr;
    document.getElementById('pelanggan').innerText = pelanggan;
    document.getElementById('metode').innerText = metode;

    function formatRupiah(angka) {
        const val = parseInt(angka) || 0;
        return 'Rp ' + val.toLocaleString('id-ID');
    }

    const subtotalVal = parseInt(params.get('subtotal')) || 0;
    const potonganVal = parseInt(params.get('potongan')) || 0;
    const namaPromo = params.get('nama_promo') || '';

    document.getElementById('subtotal').innerText = formatRupiah(subtotalVal);

    if (potonganVal > 0) {
        document.getElementById('promo-row').style.display = 'flex';
        document.getElementById('label_promo').innerText = namaPromo ? `Promo (${namaPromo}):` : 'Potongan:';
        document.getElementById('potongan').innerText = '- ' + formatRupiah(potonganVal);
    }

    const totalHargaVal = parseInt(params.get('total_harga') || params.get('total')) || 0;
    const totalBayarVal = parseInt(params.get('total_bayar')) || 0;
    const kembalianVal = parseInt(params.get('kembalian')) || 0;

    document.getElementById('total_harga').innerText = formatRupiah(totalHargaVal);
    document.getElementById('total_bayar').innerText = formatRupiah(totalBayarVal);
    document.getElementById('kembalian').innerText = formatRupiah(kembalianVal);

    // 2. Render Daftar Item
    const itemsParam = params.get('items');
    const itemsContainer = document.getElementById('items-container');
    let textItemsRaw = '';

    if (itemsParam && itemsContainer) {
        const itemsList = itemsParam.split(',');
        itemsContainer.innerHTML = '';
        
        itemsList.forEach(itemStr => {
            const parts = itemStr.split('|');
            if (parts.length >= 3) {
                const nama = parts[0].trim();
                const qty = parts[1].trim();
                const subtotalItem = parts[2].trim();

                textItemsRaw += `${nama}\n  ${qty} x ${formatRupiah(subtotalItem)}\n`;

                const div = document.createElement('div');
                div.style.marginBottom = '4px';
                div.innerHTML = `
                    <div class="item-title">${nama}</div>
                    <div class="item-row">
                        <span>${qty} x</span>
                        <span>${formatRupiah(subtotalItem)}</span>
                    </div>
                `;
                itemsContainer.appendChild(div);
            }
        });
    }

    // 3. Fungsi Utama Pencetakan (Mendukung Android Auto & Windows Laptop)
    function cetakOtomatis() {
        const isAndroid = /Android/i.test(navigator.userAgent);

        if (isAndroid) {
            // Format Plain Text ESC/POS untuk RawBT di Android
            let textToPrint = "";
            textToPrint += "AYAM BAKAR AROMA\n";
            textToPrint += "Nota Pembayaran\n";
            textToPrint += "--------------------------------\n";
            textToPrint += `No. Order: ${orderId}\n`;
            textToPrint += `Tanggal  : ${tanggalStr}\n`;
            textToPrint += `Pelanggan: ${pelanggan}\n`;
            textToPrint += `Metode   : ${metode}\n`;
            textToPrint += "--------------------------------\n";
            textToPrint += "Rincian Pesanan:\n";
            textToPrint += textItemsRaw;
            textToPrint += "--------------------------------\n";
            textToPrint += `Subtotal   : ${formatRupiah(subtotalVal)}\n`;
            if (potonganVal > 0) {
                textToPrint += `Potongan   : -${formatRupiah(potonganVal)}\n`;
            }
            textToPrint += `Total Harga: ${formatRupiah(totalHargaVal)}\n`;
            textToPrint += `Total Bayar: ${formatRupiah(totalBayarVal)}\n`;
            textToPrint += `Kembalian  : ${formatRupiah(kembalianVal)}\n`;
            textToPrint += "--------------------------------\n";
            textToPrint += "       *** TERIMA KASIH ***\n";
            textToPrint += "        Selamat Menikmati\n\n\n";

            const base64Data = btoa(unescape(encodeURIComponent(textToPrint)));
            
            // Panggil Intent Aplikasi RawBT
            window.location.href = "intent:#Intent;scheme=rawbt;package=ru.a404m.rawbtprint;S.base64=" + base64Data + ";end;";
        } else {
            // Panggil Dialog Print Browser Windows Laptop
            window.print();
        }
    }

    // 4. Eksekusi Otomatis Saat Halaman Selesai Dimuat
    window.onload = function() {
        setTimeout(() => {
            cetakOtomatis();
        }, 800);
    };
    </script>
</body>
</html>
