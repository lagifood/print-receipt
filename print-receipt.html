<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struk Pembayaran - Ayam Bakar Aroma</title>
    <style>
        /* Pengaturan Kertas Printer Thermal 58mm */
        @page {
            size: 58mm auto;
            margin: 0;
        }
        body {
            width: 58mm;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: #000;
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
        }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .bold { font-weight: bold; }
        .line {
            border-bottom: 1px dashed #000;
            margin: 6px 0;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }
        .item-list {
            margin: 4px 0;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
        }
        /* Sembunyikan tombol di layar cetak */
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body>

    <div class="text-center bold" style="font-size: 13px;">AYAM BAKAR AROMA</div>
    <div class="text-center">Nota Pembayaran</div>
    <div class="line"></div>

    <div class="row">
        <span>No. Order:</span>
        <span id="order_id" class="bold">-</span>
    </div>
    <div class="row">
        <span>Tanggal:</span>
        <span id="tanggal">-</span>
    </div>
    <div class="row">
        <span>Pelanggan:</span>
        <span id="pelanggan">-</span>
    </div>
    <div class="row">
        <span>Metode:</span>
        <span id="metode">-</span>
    </div>

    <div class="line"></div>

    <div class="bold">Rincian Pesanan:</div>
    <div id="items-container" class="item-list">
        </div>

   <div class="line"></div>

    <div class="row bold" style="font-size: 12px;">
        <span>Total Harga:</span>
        <span id="total_harga">Rp 0</span>
    </div>
    <div class="row">
        <span>Total Bayar:</span>
        <span id="total_bayar">Rp 0</span>
    </div>
    <div class="row">
        <span>Kembalian:</span>
        <span id="kembalian">Rp 0</span>
    </div>

    <div class="line"></div>

    <div class="text-center" style="margin-top: 8px;">
        *** TERIMA KASIH ***<br>
        Selamat Menikmati
    </div>

    <div class="no-print text-center" style="margin-top: 15px;">
        <button onclick="window.print()" style="padding: 5px 10px; cursor: pointer;">Cetak Struk</button>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);

    // 1. Ambil No. Order (Mendukung nama 'order_id' maupun 'id')
    const orderId = params.get('order_id') || params.get('id') || '-';
    
    // 2. Tampilkan ke HTML (Menggunakan ID yang sesuai dengan HTML Anda)
    if(document.getElementById('id_order')) document.getElementById('id_order').innerText = orderId;
    if(document.getElementById('order_id')) document.getElementById('order_id').innerText = orderId;

    document.getElementById('tanggal').innerText = (params.get('tanggal') || '') + ' ' + (params.get('waktu') || '');
    
    // Cek ID nama pelanggan
    if(document.getElementById('nama_pelanggan')) document.getElementById('nama_pelanggan').innerText = params.get('pelanggan') || '-';
    if(document.getElementById('pelanggan')) document.getElementById('pelanggan').innerText = params.get('pelanggan') || '-';

    // Cek ID metode pembayaran
    if(document.getElementById('metode_pembayaran')) document.getElementById('metode_pembayaran').innerText = params.get('metode') || 'Tunai';
    if(document.getElementById('metode')) document.getElementById('metode').innerText = params.get('metode') || 'Tunai';

    // Format Rupiah
    function formatRupiah(angka) {
        const val = parseInt(angka) || 0;
        return 'Rp ' + val.toLocaleString('id-ID');
    }

    // 3. Tampilkan Total Harga, Total Bayar, dan Kembalian
    if(document.getElementById('total_harga')) document.getElementById('total_harga').innerText = formatRupiah(params.get('total_harga') || params.get('total'));
    if(document.getElementById('total_bayar')) document.getElementById('total_bayar').innerText = formatRupiah(params.get('total_bayar'));
    if(document.getElementById('kembalian')) document.getElementById('kembalian').innerText = formatRupiah(params.get('kembalian'));

    // 4. Render Rincian Barang
    const itemsParam = params.get('items');
    const itemsContainer = document.getElementById('items-container');

    if (itemsParam && itemsContainer) {
        const itemsList = itemsParam.split(',');
        itemsContainer.innerHTML = '';
        
        itemsList.forEach(itemStr => {
            const parts = itemStr.split('|');
            if (parts.length >= 3) {
                const nama = parts[0].trim();
                const qty = parts[1].trim();
                const subtotal = parts[2].trim();

                const div = document.createElement('div');
                div.style.marginBottom = '4px';
                div.innerHTML = `
                    <div>${nama}</div>
                    <div class="item-row">
                        <span>  ${qty} x</span>
                        <span>${formatRupiah(subtotal)}</span>
                    </div>
                `;
                itemsContainer.appendChild(div);
            }
        });
    }

    // Auto Print
    window.onload = function() {
        setTimeout(() => {
            window.print();
        }, 500);
    };
</script>
</body>
</html>
