<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Struk</title>
</head>
<body>
    <p style="text-align:center; font-family:sans-serif; margin-top:30px;">
        Memproses cetak struk...
    </p>

    <script>
    const params = new URLSearchParams(window.location.search);

    const orderId = params.get('order_id') || params.get('id') || '-';
    const tanggalStr = (params.get('tanggal') || '') + ' ' + (params.get('waktu') || '');
    const pelanggan = params.get('pelanggan') || '-';
    const metode = params.get('metode') || 'Tunai';

    function formatRupiah(angka) {
        const val = parseInt(angka) || 0;
        return 'Rp ' + val.toLocaleString('id-ID');
    }

    const subtotalVal = parseInt(params.get('subtotal')) || 0;
    const potonganVal = parseInt(params.get('potongan')) || 0;
    const namaPromo = params.get('nama_promo') || '';
    const totalHargaVal = parseInt(params.get('total_harga') || params.get('total')) || 0;
    const totalBayarVal = parseInt(params.get('total_bayar')) || 0;
    const kembalianVal = parseInt(params.get('kembalian')) || 0;

    // Susun Rincian Barang
    let itemsTxt = "";
    const itemsParam = params.get('items');
    if (itemsParam) {
        const itemsList = itemsParam.split(',');
        itemsList.forEach(itemStr => {
            const parts = itemStr.split('|');
            if (parts.length >= 3) {
                const nama = parts[0].trim();
                const qty = parts[1].trim();
                const subtotalItem = parts[2].trim();
                itemsTxt += `${nama}\n  ${qty} x ${formatRupiah(subtotalItem)}\n`;
            }
        });
    }

    // Susun Teks Struk Utuh
    let txt = "";
    txt += "       AYAM BAKAR AROMA\n";
    txt += "        Nota Pembayaran\n";
    txt += "--------------------------------\n";
    txt += `No. Order: ${orderId}\n`;
    txt += `Tanggal  : ${tanggalStr}\n`;
    txt += `Pelanggan: ${pelanggan}\n`;
    txt += `Metode   : ${metode}\n`;
    txt += "--------------------------------\n";
    txt += "Rincian Pesanan:\n";
    txt += itemsTxt;
    txt += "--------------------------------\n";
    txt += `Subtotal   : ${formatRupiah(subtotalVal)}\n`;
    if (potonganVal > 0) {
        txt += `Promo      : -${formatRupiah(potonganVal)}\n`;
    }
    txt += `Total Harga: ${formatRupiah(totalHargaVal)}\n`;
    txt += `Total Bayar: ${formatRupiah(totalBayarVal)}\n`;
    txt += `Kembalian  : ${formatRupiah(kembalianVal)}\n`;
    txt += "--------------------------------\n";
    txt += "       *** TERIMA KASIH ***\n";
    txt += "        Selamat Menikmati\n\n\n\n";

    // Kirim langsung via intent RAWBT Plain Text
    window.onload = function() {
        const intentUrl = "intent:" + encodeURIComponent(txt) + "#Intent;scheme=rawbt;package=ru.a404m.rawbtprint;S.type=text/plain;end;";
        window.location.href = intentUrl;
    };
    </script>
</body>
</html>
