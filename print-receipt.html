<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Struk Teks</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        .btn-cetak {
            background-color: #28a745; color: white; font-size: 18px;
            font-weight: bold; padding: 15px 30px; border: none;
            border-radius: 8px; cursor: pointer; width: 100%; max-width: 350px;
        }
    </style>
</head>
<body>

    <h3>Memproses Struk...</h3>
    <button class="btn-cetak" onclick="cetakTeks()">KLIK DI SINI UNTUK MENCETAK</button>

    <script>
    const params = new URLSearchParams(window.location.search);

    const orderId = params.get('order_id') || params.get('id') || '-';
    const tanggalStr = (params.get('tanggal') || '') + ' ' + (params.get('waktu') || '');
    const pelanggan = params.get('pelanggan') || '-';
    const metode = params.get('metode') || 'Tunai';

    function formatRupiah(angka) {
        return 'Rp ' + (parseInt(angka) || 0).toLocaleString('id-ID');
    }

    // Susun Teks Pesanan
    let itemsTxt = "";
    const itemsParam = params.get('items');
    if (itemsParam) {
        itemsParam.split(',').forEach(itemStr => {
            const parts = itemStr.split('|');
            if (parts.length >= 3) {
                itemsTxt += `${parts[0].trim()}\n  ${parts[1].trim()} x ${formatRupiah(parts[2].trim())}\n`;
            }
        });
    }

    // Susun Format Teks Struk Utuh
    let txt = "";
    txt += "       AYAM BAKAR AROMA\n";
    txt += "        Nota Pembayaran\n";
    txt += "--------------------------------\n";
    txt += `No. Order: ${orderId}\n`;
    txt += `Tanggal  : ${tanggalStr}\n`;
    txt += `Pelanggan: ${pelanggan}\n`;
    txt += `Metode   : ${metode}\n`;
    txt += "--------------------------------\n";
    txt += "Rincian Pesanan:\n";
    txt += itemsTxt;
    txt += "--------------------------------\n";
    txt += `Subtotal   : ${formatRupiah(params.get('subtotal'))}\n`;
    
    const potonganVal = parseInt(params.get('potongan')) || 0;
    if (potonganVal > 0) {
        txt += `Promo      : -${formatRupiah(potonganVal)}\n`;
    }
    
    txt += `Total Harga: ${formatRupiah(params.get('total_harga') || params.get('total'))}\n`;
    txt += `Total Bayar: ${formatRupiah(params.get('total_bayar'))}\n`;
    txt += `Kembalian  : ${formatRupiah(params.get('kembalian'))}\n`;
    txt += "--------------------------------\n";
    txt += "       *** TERIMA KASIH ***\n";
    txt += "        Selamat Menikmati\n\n\n\n";

    function cetakTeks() {
        // Mengirimkan TEKS MENTAH langsung via skema rawbt (Tanpa gambar, tanpa Play Store)
        window.location.href = "rawbt:text/" + encodeURIComponent(txt);
    }

    // Eksekusi Otomatis
    window.onload = function() {
        setTimeout(cetakTeks, 1000);
    };
    </script>
</body>
</html>
