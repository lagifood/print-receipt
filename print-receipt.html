<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struk Pembayaran - Ayam Bakar Aroma</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #000;
            margin: 0;
            padding: 10px;
            background-color: #fff;
        }
        #receipt-area {
            width: 500px;
            padding: 15px;
            background: #fff;
            margin: 0 auto;
        }
        .text-center { text-align: center; }
        .bold { font-weight: bold; }
        .line { border-bottom: 2px dashed #000; margin: 10px 0; }
        .row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .item-row { display: flex; justify-content: space-between; font-size: 12px; padding-left: 10px; }
        .item-title { font-weight: bold; margin-top: 5px; }
        
        /* Area Tombol */
        .btn-container {
            margin-top: 25px;
            text-align: center;
        }
        .btn-cetak {
            background-color: #007bff;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .btn-cetak:active {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div id="receipt-area">
        <div class="text-center bold" style="font-size: 18px;">AYAM BAKAR AROMA</div>
        <div class="text-center" style="font-size: 13px;">Nota Pembayaran</div>
        <div class="line"></div>

        <div class="row"><span>No. Order:</span><span id="order_id" class="bold">-</span></div>
        <div class="row"><span>Tanggal:</span><span id="tanggal">-</span></div>
        <div class="row"><span>Pelanggan:</span><span id="pelanggan">-</span></div>
        <div class="row"><span>Metode:</span><span id="metode">-</span></div>

        <div class="line"></div>
        <div class="bold">Rincian Pesanan:</div>
        <div id="items-container"></div>

        <div class="line"></div>
        <div class="row"><span>Subtotal:</span><span id="subtotal">Rp 0</span></div>
        <div id="promo-row" class="row" style="display: none;">
            <span id="label_promo">Potongan Promo:</span>
            <span id="potongan">-Rp 0</span>
        </div>

        <div class="row bold" style="font-size: 16px; margin-top: 6px;">
            <span>Total Harga:</span>
            <span id="total_harga">Rp 0</span>
        </div>
        <div class="row"><span>Total Bayar:</span><span id="total_bayar">Rp 0</span></div>
        <div class="row"><span>Kembalian:</span><span id="kembalian">Rp 0</span></div>

        <div class="line"></div>
        <div class="text-center" style="margin-top: 15px;">
            *** TERIMA KASIH ***<br>
            Selamat Menikmati
            <br><br>
        </div>
    </div>

    <!-- TOMBOL UNTUK MEMICU RAWBT DI IN-APP BROWSER -->
    <div class="btn-container">
        <button class="btn-cetak" onclick="prosesCetakJPG()">CETAK KE PRINTER</button>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id') || params.get('id') || 'STRUK';
    const tanggalStr = (params.get('tanggal') || '') + ' ' + (params.get('waktu') || '');
    
    document.getElementById('order_id').innerText = orderId;
    document.getElementById('tanggal').innerText = tanggalStr;
    document.getElementById('pelanggan').innerText = params.get('pelanggan') || '-';
    document.getElementById('metode').innerText = params.get('metode') || 'Tunai';

    function formatRupiah(angka) {
        return 'Rp ' + (parseInt(angka) || 0).toLocaleString('id-ID');
    }

    document.getElementById('subtotal').innerText = formatRupiah(params.get('subtotal'));
    
    const potonganVal = parseInt(params.get('potongan')) || 0;
    if (potonganVal > 0) {
        document.getElementById('promo-row').style.display = 'flex';
        document.getElementById('potongan').innerText = '- ' + formatRupiah(potonganVal);
    }

    document.getElementById('total_harga').innerText = formatRupiah(params.get('total_harga') || params.get('total'));
    document.getElementById('total_bayar').innerText = formatRupiah(params.get('total_bayar'));
    document.getElementById('kembalian').innerText = formatRupiah(params.get('kembalian'));

    const itemsParam = params.get('items');
    const itemsContainer = document.getElementById('items-container');
    if (itemsParam && itemsContainer) {
        itemsContainer.innerHTML = '';
        itemsParam.split(',').forEach(itemStr => {
            const parts = itemStr.split('|');
            if (parts.length >= 3) {
                const div = document.createElement('div');
                div.innerHTML = `
                    <div class="item-title">${parts[0].trim()}</div>
                    <div class="item-row">
                        <span>${parts[1].trim()} x</span>
                        <span>${formatRupiah(parts[2].trim())}</span>
                    </div>
                `;
                itemsContainer.appendChild(div);
            }
        });
    }

    // FUNGSI UTAMA CETAK JPG
    function prosesCetakJPG() {
        const element = document.getElementById('receipt-area');
        
        html2canvas(element, { scale: 1.5, backgroundColor: "#ffffff" }).then(canvas => {
            const imgData = canvas.toDataURL("image/jpeg", 0.9).replace(/^data:image\/(jpeg|jpg);base64,/, "");
            
            // Pemicu berbasis Gesture Klik Pengguna (Bisa menembus proteksi In-App Browser)
            window.location.href = "intent:#Intent;scheme=rawbt;package=ru.a404m.rawbtprint;S.base64=" + imgData + ";end;";
        });
    }

    // Mencoba jalankan otomatis terlebih dahulu
    window.onload = function() {
        setTimeout(prosesCetakJPG, 1200);
    };
    </script>
</body>
</html>
