<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struk Pembayaran - Ayam Bakar Aroma (USB 80mm)</title>
    <!-- Library untuk Konversi Canvas & Koneksi USB via QZ Tray -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qz-tray/2.2.4/qz-tray.min.js"></script>
    
    <style>
        /* Pengaturan Layout Struk Asli Disesuaikan ke Skala Kertas 80mm */
        body {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #000;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f9;
        }
        #receipt-area {
            width: 550px; /* Lebar optimal untuk rendering gambar printer 80mm */
            padding: 12px;
            background: #fff;
            margin: 0 auto;
            box-sizing: border-box;
            border: 1px solid #ddd;
        }
        .text-center { text-align: center; }
        .bold { font-weight: bold; }
        .line {
            border-bottom: 1px dashed #000;
            margin: 8px 0;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }
        .item-list {
            margin: 6px 0;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }
        
        .status-box {
            max-width: 550px;
            margin: 10px auto;
            padding: 8px;
            text-align: center;
            font-family: sans-serif;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            background-color: #e2e3e5;
            color: #383d41;
        }
    </style>
</head>
<body>

    <div id="status" class="status-box">Menghubungkan ke QZ Tray...</div>

    <!-- AREA STRUK DENGAN STRUKTUR & KODE ASLI ANDA -->
    <div id="receipt-area">
        <div class="text-center bold" style="font-size: 16px;">AYAM BAKAR AROMA</div>
        <div class="text-center">Nota Pembayaran</div>
        <div class="line"></div>

        <div class="row">
            <span>No. Order:</span>
            <span id="order_id" class="bold">-</span>
        </div>
        <div class="row">
            <span>Tanggal:</span>
            <span id="tanggal">-</span>
        </div>
        <div class="row">
            <span>Pelanggan:</span>
            <span id="pelanggan">-</span>
        </div>
        <div class="row">
            <span>Metode:</span>
            <span id="metode">-</span>
        </div>

        <div class="line"></div>

        <div class="bold">Rincian Pesanan:</div>
        <div id="items-container" class="item-list"></div>

        <div class="line"></div>

        <!-- Section Perhitungan Harga & Promo -->
        <div class="row">
            <span>Subtotal:</span>
            <span id="subtotal">Rp 0</span>
        </div>
        <div id="promo-row" class="row" style="display: none;">
            <span id="label_promo">Potongan Promo:</span>
            <span id="potongan">-Rp 0</span>
        </div>

        <div class="row bold" style="font-size: 15px; margin-top: 4px;">
            <span>Total Harga:</span>
            <span id="total_harga">Rp 0</span>
        </div>
        <div class="row">
            <span>Total Bayar:</span>
            <span id="total_bayar">Rp 0</span>
        </div>
        <div class="row">
            <span>Kembalian:</span>
            <span id="kembalian">Rp 0</span>
        </div>

        <div class="line"></div>

        <div class="text-center" style="margin-top: 10px;">
            *** TERIMA KASIH ***<br>
            Selamat Menikmati
            <br><br>
        </div>
    </div>

    <script>
    // ** PENGATURAN NAMA PRINTER USB **
    const PRINTER_NAME_USB = "CX-805"; 

    const params = new URLSearchParams(window.location.search);

    // 1. Ambil No. Order
    const orderId = params.get('order_id') || params.get('id') || '-';
    if(document.getElementById('order_id')) document.getElementById('order_id').innerText = orderId;

    // 2. Tanggal & Waktu
    document.getElementById('tanggal').innerText = (params.get('tanggal') || '') + ' ' + (params.get('waktu') || '');

    // 3. Pelanggan & Metode
    document.getElementById('pelanggan').innerText = params.get('pelanggan') || '-';
    document.getElementById('metode').innerText = params.get('metode') || 'Tunai';

    // Format Rupiah Helper
    function formatRupiah(angka) {
        const val = parseInt(angka) || 0;
        return 'Rp ' + val.toLocaleString('id-ID');
    }

    // 4. Render Subtotal, Promo & Total
    const subtotalVal = parseInt(params.get('subtotal')) || 0;
    const potonganVal = parseInt(params.get('potongan')) || 0;
    const namaPromo = params.get('nama_promo') || '';

    document.getElementById('subtotal').innerText = formatRupiah(subtotalVal);

    if (potonganVal > 0) {
        const promoRow = document.getElementById('promo-row');
        const labelPromo = document.getElementById('label_promo');
        const potonganEl = document.getElementById('potongan');

        promoRow.style.display = 'flex';
        labelPromo.innerText = namaPromo ? `Promo (${namaPromo}):` : 'Potongan:';
        potonganEl.innerText = '- ' + formatRupiah(potonganVal);
    }

    document.getElementById('total_harga').innerText = formatRupiah(params.get('total_harga') || params.get('total'));
    document.getElementById('total_bayar').innerText = formatRupiah(params.get('total_bayar'));
    document.getElementById('kembalian').innerText = formatRupiah(params.get('kembalian'));

    // 5. Render Rincian Barang
    const itemsParam = params.get('items');
    const itemsContainer = document.getElementById('items-container');

    if (itemsParam && itemsContainer) {
        const itemsList = itemsParam.split(',');
        itemsContainer.innerHTML = '';
        
        itemsList.forEach(itemStr => {
            const parts = itemStr.split('|');
            if (parts.length >= 3) {
                const nama = parts[0].trim();
                const qty = parts[1].trim();
                const subtotalItem = parts[2].trim();

                const div = document.createElement('div');
                div.style.marginBottom = '4px';
                div.innerHTML = `
                    <div style="font-weight: bold;">${nama}</div>
                    <div class="item-row">
                        <span>  ${qty} x</span>
                        <span>${formatRupiah(subtotalItem)}</span>
                    </div>
                `;
                itemsContainer.appendChild(div);
            }
        });
    }

    // MEKANISME OTOMATIS CETAK KE PRINTER USB VIA QZ TRAY
    async function prosesCetakUSB() {
        const statusDiv = document.getElementById('status');
        try {
            if (!qz.websocket.isActive()) {
                await qz.websocket.connect();
            }
            statusDiv.innerText = "Terhubung. Mengirim ke printer CX-805...";
            statusDiv.style.backgroundColor = "#cce5ff";

            // Render area HTML struk menjadi gambar PNG beresolusi tinggi
            const element = document.getElementById('receipt-area');
            const canvas = await html2canvas(element, { scale: 2, backgroundColor: "#ffffff" });
            const imgBase64 = canvas.toDataURL("image/png");

            // Konfigurasi Printer USB & Kirim Data
            const config = qz.configs.create(PRINTER_NAME_USB);
            const printData = [{
                type: 'pixel',
                format: 'image',
                flavor: 'base64',
                data: imgBase64
            }];

            await qz.print(config, printData);
            statusDiv.innerText = "✅ Struk Berhasil Dicetak!";
            statusDiv.style.backgroundColor = "#d4edda";
            statusDiv.style.color = "#155724";

            // Tutup tab otomatis setelah sukses
            setTimeout(() => { window.close(); }, 1500);

        } catch (err) {
            console.error(err);
            statusDiv.innerText = "❌ Gagal Cetak: Pastikan QZ Tray aktif & nama printer 'CX-805' sesuai!";
            statusDiv.style.backgroundColor = "#f8d7da";
            statusDiv.style.color = "#721c24";
        }
    }

    // Jalankan Otomatis
    window.onload = function() {
        setTimeout(prosesCetakUSB, 800);
    };
    </script>
</body>
</html>
