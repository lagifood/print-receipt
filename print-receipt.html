<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struk Pembayaran - Ayam Bakar Aroma</title>
    <style>
        /* Pengaturan Kertas Thermal 80mm */
        @page {
            size: 80mm auto;
            margin: 0;
        }
        body {
            width: 80mm;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #000;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .text-center { text-align: center; }
        .bold { font-weight: bold; }
        .line {
            border-bottom: 1px dashed #000;
            margin: 6px 0;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body>

    <div class="text-center bold" style="font-size: 16px;">AYAM BAKAR AROMA</div>
    <div class="text-center">Nota Pembayaran</div>
    <div class="line"></div>

    <div class="row"><span>No. Order:</span><span id="order_id" class="bold">-</span></div>
    <div class="row"><span>Tanggal:</span><span id="tanggal">-</span></div>
    <div class="row"><span>Pelanggan:</span><span id="pelanggan">-</span></div>
    <div class="row"><span>Metode:</span><span id="metode">-</span></div>

    <div class="line"></div>

    <div class="bold">Rincian Pesanan:</div>
    <div id="items-container"></div>

    <div class="line"></div>

    <div class="row"><span>Subtotal:</span><span id="subtotal">Rp 0</span></div>
    <div id="promo-row" class="row" style="display: none;">
        <span id="label_promo">Potongan Promo:</span>
        <span id="potongan">-Rp 0</span>
    </div>

    <div class="row bold" style="font-size: 14px; margin-top: 4px;">
        <span>Total Harga:</span>
        <span id="total_harga">Rp 0</span>
    </div>
    <div class="row"><span>Total Bayar:</span><span id="total_bayar">Rp 0</span></div>
    <div class="row"><span>Kembalian:</span><span id="kembalian">Rp 0</span></div>

    <div class="line"></div>

    <div class="text-center" style="margin-top: 10px;">
        *** TERIMA KASIH ***<br>
        Selamat Menikmati
    </div>

    <div class="no-print text-center" style="margin-top: 20px;">
        <button onclick="cetakBluetooth()" style="padding: 10px 20px; font-weight: bold; cursor: pointer;">Cetak Struk Auto</button>
    </div>

    <script>
    // Fungsi Pengiriman Cetak ke RawBT via Intent (Lebih Stabil di Chrome Android)
function cetakBluetooth() {
    let textToPrint = "";
    textToPrint += "AYAM BAKAR AROMA\n";
    textToPrint += "Nota Pembayaran\n";
    textToPrint += "--------------------------------\n";
    textToPrint += `No. Order: ${orderId}\n`;
    textToPrint += `Tanggal  : ${tanggalStr}\n`;
    textToPrint += `Pelanggan: ${pelanggan}\n`;
    textToPrint += `Metode   : ${metode}\n`;
    textToPrint += "--------------------------------\n";
    textToPrint += "Rincian Pesanan:\n";
    textToPrint += textItemsForRawBT;
    textToPrint += "--------------------------------\n";
    textToPrint += `Subtotal   : ${formatRupiah(subtotalVal)}\n`;
    if (potonganVal > 0) {
        textToPrint += `Potongan   : -${formatRupiah(potonganVal)}\n`;
    }
    textToPrint += `Total Harga: ${formatRupiah(totalHargaVal)}\n`;
    textToPrint += `Total Bayar: ${formatRupiah(totalBayarVal)}\n`;
    textToPrint += `Kembalian  : ${formatRupiah(kembalianVal)}\n`;
    textToPrint += "--------------------------------\n";
    textToPrint += "       *** TERIMA KASIH ***\n";
    textToPrint += "        Selamat Menikmati\n\n\n";

    const base64Data = btoa(unescape(encodeURIComponent(textToPrint)));
    
    // Gunakan Skema Intent Android agar tidak diblokir browser
    window.location.href = "intent:#Intent;scheme=rawbt;package=ru.a404m.rawbtprint;S.base64=" + base64Data + ";end;";
}

// Jalankan otomatis
window.onload = function() {
    setTimeout(() => {
        cetakBluetooth();
    }, 800);
};
</script>
</body>
</html>
